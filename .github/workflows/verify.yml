name: Verify

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Create dummy Supabase env for CI
        run: |
          echo "VITE_SUPABASE_URL=https://example.supabase.co" > .env
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_dummy_test_key_for_ci_only" >> .env
          echo "Created .env for CI:"
          cat .env

      - name: Install dependencies
        run: npm ci

      - name: Operational tests
        run: npm test

      - name: TypeScript unused symbol gate
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install browser for end-to-end checks
        run: npx playwright install --with-deps chromium

      - name: Browser, mobile and PWA checks
        run: npx playwright test
